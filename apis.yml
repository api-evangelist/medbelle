aid: medbelle
name: Medbelle
description: 'Medbelle was a London-headquartered digital healthcare company, founded
  in 2016 by Leander de Laporte and Daniel Kolb, that operated as a "digital hospital"
  coordinating elective specialist care across the UK. It combined a technology platform
  (marketed as Medbelle OS, with a CareConnect virtual-first assessment pathway) with
  human Patient Care Advisers to route patients through consultation, diagnostics,
  surgery and aftercare, working with clinicians, hospitals, insurers, employers and
  case managers. Specialties spanned cosmetic, bariatric, orthopaedic and ophthalmic
  surgery. Medbelle ceased trading in 2026 and its technology platform was transferred
  elsewhere; medbelle.com now serves a single farewell page and every other path on
  the domain returns 404. No public developer program, API documentation or machine-readable
  API contract was ever published, and none survives.'
